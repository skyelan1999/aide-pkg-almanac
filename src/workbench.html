<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>黄历 · Almanac</title><style>/* CSS */</style></head>
<body><div class="app"><header class="masthead"><div class="identity"><span class="seal" aria-hidden="true">历</span><div><h1>黄历 <span>ALMANAC</span></h1><p>循时而行，知日有序</p></div></div><div class="header-meta"><span class="zone">中国标准时间 · UTC+8</span><button id="theme" class="quiet" type="button" aria-label="切换明暗主题">明 / 暗</button></div></header>
<div id="notice" role="status" aria-live="polite">正在连接 Aide 黄历工具…</div>
<main id="content" aria-busy="true"><section class="calendar panel" aria-labelledby="month-title"><div class="calendar-heading"><div><p class="eyebrow">公历 / 农历</p><h2 id="month-title">月历</h2></div><div class="month-actions"><button id="prev-month" aria-label="上个月" title="上个月" type="button">‹</button><button id="today" type="button">今天</button><button id="next-month" aria-label="下个月" title="下个月" type="button">›</button></div></div>
<div id="date-form" role="group" aria-label="日期查询"><label for="date">查看日期</label><input id="date" type="date" min="1901-01-01" max="2099-12-31" required><button type="button" id="go">查看</button></div>
<div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="days" class="days" role="group" aria-label="月历日期"></div><div class="calendar-footer"><span><i class="today-dot"></i> 今天</span><span><i class="term-dot"></i> 节气</span><span>支持 1901–2099 年</span></div>
<div class="solar-note"><span class="solar-icon" aria-hidden="true">☼</span><div><span class="eyebrow">节气有时</span><p id="next-term">随日期查看节气</p></div></div></section>
<section class="daily panel" aria-labelledby="daily-title"><div class="day-heading"><div><p class="eyebrow" id="selected-date">所选日期</p><h2 id="daily-title">每日黄历</h2><p id="lunar-title"></p></div><strong id="day-number" aria-hidden="true">—</strong></div><div id="day-tags" class="tags"></div>
<div class="yi-ji"><section class="yi"><h3><span>宜</span> 诸事所宜</h3><div id="yi" class="chips"></div></section><section class="ji"><h3><span>忌</span> 诸事所忌</h3><div id="ji" class="chips"></div></section></div>
<dl id="facts" class="facts"></dl><details class="more"><summary>更多黄历资料</summary><dl id="more-facts" class="facts"></dl></details></section></main>
<footer class="page-footer"><span>本地历法 · 离线查询 · 与 Aide 工具同源</span><p>宜忌为传统民俗资料，非科学预测；不同流派可能有差异。节日名称不代表法定放假或调休安排。</p><small>日期依据香港天文台历表 · 时刻为算法估算 · 民俗规则 lunar-javascript 1.7.7</small></footer></div><script>/* BRIDGE */</script><script>/* JS */</script></body></html>
